<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Attendance Tracker — MMMUT ChE</title>
<meta name="theme-color" content="#0ea5e9">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f8fafc; --card:#ffffff; --text:#0f172a; --muted:#64748b; --border:#e2e8f0;
  --accent:#0ea5e9; --accent2:#6366f1; --good:#10b981; --warn:#f59e0b; --bad:#ef4444;
  --radius:16px; --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
}
[data-theme="dark"]{
  --bg:#0b1220; --card:#111a2c; --text:#e5e9f0; --muted:#8b98ac; --border:#1f2a3e;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);transition:background .2s,color .2s;}
button{font-family:inherit;cursor:pointer}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:80px;position:relative}
header.top{position:sticky;top:0;z-index:10;background:var(--bg);padding:16px 16px 8px;
  display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(8px)}
header.top h1{font-size:18px;margin:0;font-weight:700}
.icon-btn{background:var(--card);border:1px solid var(--border);border-radius:12px;
  width:40px;height:40px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
main{padding:8px 16px 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:14px;margin:0 0 12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.big-stat{display:flex;align-items:baseline;gap:8px}
.big-stat .num{font-size:42px;font-weight:800;line-height:1}
.big-stat .lbl{color:var(--muted);font-size:13px}
.progress{height:8px;border-radius:99px;background:var(--border);overflow:hidden;margin-top:12px}
.progress > div{height:100%;border-radius:99px;transition:width .3s}
.class-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;
  border-bottom:1px solid var(--border)}
.class-item:last-child{border-bottom:none}
.class-info{display:flex;gap:10px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.class-name{font-weight:600;font-size:14px}
.class-meta{font-size:12px;color:var(--muted);margin-top:2px}
.mark-btns{display:flex;gap:6px}
.mark-btn{border:1px solid var(--border);background:var(--bg);border-radius:10px;
  width:36px;height:36px;font-size:16px;display:flex;align-items:center;justify-content:center;transition:.15s}
.mark-btn.active-p{background:var(--good);border-color:var(--good);color:#fff}
.mark-btn.active-a{background:var(--bad);border-color:var(--bad);color:#fff}
.mark-btn.active-c{background:var(--muted);border-color:var(--muted);color:#fff}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);
  display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));
  max-width:520px;margin:0 auto;z-index:20}
.tab{background:none;border:none;color:var(--muted);display:flex;flex-direction:column;
  align-items:center;gap:2px;font-size:10px;padding:4px 12px;border-radius:10px}
.tab.active{color:var(--accent)}
.tab svg{width:22px;height:22px}
.view{display:none}
.view.active{display:block;animation:fadein .2s}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.subject-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}
.subject-row:last-child{border-bottom:none}
.badge{font-size:11px;padding:3px 8px;border-radius:99px;font-weight:700}
.badge.good{background:rgba(16,185,129,.15);color:var(--good)}
.badge.warn{background:rgba(245,158,11,.15);color:var(--warn)}
.badge.bad{background:rgba(239,68,68,.15);color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:32px 16px;font-size:14px}
input,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);font-size:14px}
label{font-size:12px;color:var(--muted);display:block;margin:10px 0 4px}
.btn{padding:10px 16px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-weight:600;font-size:14px}
.btn.secondary{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.row{display:flex;gap:8px}
.week-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.day-cell{text-align:center;padding:8px 2px;border-radius:10px;font-size:11px;background:var(--bg);border:1px solid var(--border)}
.day-cell.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--text);
  color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13px;z-index:50;opacity:0;
  transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini-stat{background:var(--bg);border-radius:12px;padding:10px 12px}
.mini-stat .n{font-size:20px;font-weight:800}
.mini-stat .l{font-size:11px;color:var(--muted)}
svg.chart{width:100%;height:120px}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 id="headerTitle">Today</h1>
    <button class="icon-btn" id="themeToggle">🌙</button>
  </header>
  <main id="main"></main>
  <div class="toast" id="toast"></div>
  <nav class="tabbar">
    <button class="tab active" data-view="today">📅<span>Today</span></button>
    <button class="tab" data-view="subjects">📊<span>Subjects</span></button>
    <button class="tab" data-view="timetable">🗓️<span>Timetable</span></button>
    <button class="tab" data-view="calendar">📖<span>History</span></button>
    <button class="tab" data-view="settings">⚙️<span>Settings</span></button>
  </nav>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
