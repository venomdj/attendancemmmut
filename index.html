<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Attendance — MMMUT ChE</title>
<meta name="theme-color" content="#070b14">
<meta name="description" content="A premium attendance companion for MMMUT students.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%236c8cff'/%3E%3Cpath d='M30 52 L44 66 L72 34' stroke='white' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --font-display:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;

  --bg:#f4f6fb; --bg-elev:#ffffff; --surface:#ffffff; --surface-2:#f0f2f8;
  --text:#0f1524; --muted:#66708a; --border:#e4e8f2; --border-soft:#edf0f7;
  --accent:#4f6ef7; --accent-2:#9b6bff; --ring-track:#e9ecf5;
  --good:#18a37b; --good-bg:rgba(24,163,123,.12);
  --warn:#c98216; --warn-bg:rgba(201,130,22,.12);
  --bad:#e0475a; --bad-bg:rgba(224,71,90,.12);
  --shadow-sm:0 1px 2px rgba(15,21,36,.04), 0 1px 1px rgba(15,21,36,.03);
  --shadow-md:0 8px 24px -8px rgba(15,21,36,.12), 0 2px 6px rgba(15,21,36,.05);
  --shadow-lg:0 24px 48px -16px rgba(15,21,36,.22);
  --grad:linear-gradient(135deg,var(--accent),var(--accent-2));
  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-xl:28px;
  --sidebar-w:264px;
}
[data-theme="dark"]{
  --bg:#070a12; --bg-elev:#0b0f1a; --surface:#0e1220; --surface-2:#121729;
  --text:#eef1fb; --muted:#8a92ad; --border:#1c2236; --border-soft:#171c2c;
  --accent:#6c8cff; --accent-2:#a978ff; --ring-track:#1a2036;
  --good:#3ddcac; --good-bg:rgba(61,220,172,.12);
  --warn:#ffb648; --warn-bg:rgba(255,182,72,.12);
  --bad:#ff6b7d; --bad-bg:rgba(255,107,125,.14);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 12px 28px -10px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.35);
  --shadow-lg:0 32px 64px -20px rgba(0,0,0,.65);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth}
body{
  margin:0; font-family:var(--font-body); background:var(--bg); color:var(--text);
  transition:background .35s ease, color .35s ease;
}
button,input,select{font-family:inherit}
button{cursor:pointer}
::selection{background:color-mix(in srgb, var(--accent) 30%, transparent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
}

h1,h2,h3,h4{font-family:var(--font-display); margin:0}

/* ============================================================
   APP SHELL
   ============================================================ */
.shell{display:flex; min-height:100vh}

/* ---------- Sidebar ---------- */
.sidebar{
  width:var(--sidebar-w); flex-shrink:0; position:sticky; top:0; height:100vh;
  background:var(--bg-elev); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:22px 16px; gap:6px; z-index:40;
}
.brand{display:flex; align-items:center; gap:12px; padding:6px 10px 22px}
.brand-mark{
  width:38px; height:38px; border-radius:12px; background:var(--grad); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-sm);
}
.brand-mark svg{width:20px;height:20px}
.brand-text{line-height:1.15; min-width:0}
.brand-text .b1{font-family:var(--font-display); font-weight:800; font-size:15.5px; letter-spacing:-.01em}
.brand-text .b2{font-size:11.5px; color:var(--muted); font-weight:500}

.nav-group{display:flex; flex-direction:column; gap:2px; margin-bottom:14px}
.nav-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:700; padding:10px 12px 6px}
.nav-item{
  display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:var(--r-sm);
  color:var(--muted); font-weight:600; font-size:14px; background:none; border:none; text-align:left;
  transition:background .18s ease, color .18s ease, transform .15s ease; position:relative; width:100%;
}
.nav-item svg{width:18px; height:18px; flex-shrink:0; opacity:.85}
.nav-item:hover{background:var(--surface-2); color:var(--text)}
.nav-item.active{background:color-mix(in srgb, var(--accent) 12%, transparent); color:var(--accent)}
.nav-item.active svg{opacity:1}
.nav-item .nav-dot{
  margin-left:auto; width:7px; height:7px; border-radius:50%; background:var(--bad); flex-shrink:0;
}

.sidebar-foot{margin-top:auto; padding-top:14px; border-top:1px solid var(--border-soft)}
.sync-pill{
  display:flex; align-items:center; gap:9px; padding:10px 12px; border-radius:var(--r-sm);
  background:var(--surface-2); font-size:12.5px; color:var(--muted); font-weight:600;
}
.sync-pill .dot{width:8px;height:8px;border-radius:50%; background:var(--muted); flex-shrink:0; transition:.3s}
.sync-pill .dot.online{background:var(--good); box-shadow:0 0 0 3px var(--good-bg)}
.sync-pill .dot.syncing{background:var(--warn); animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}

/* ---------- Main column ---------- */
.main-col{flex:1; min-width:0; display:flex; flex-direction:column}

.topbar{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:14px;
  padding:16px 28px; background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border-soft);
}
.search-box{
  flex:1; max-width:360px; display:flex; align-items:center; gap:9px; padding:9px 14px;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-sm);
  color:var(--muted); font-size:13.5px; transition:border-color .2s, box-shadow .2s;
}
.search-box:focus-within{border-color:var(--accent); box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 12%, transparent)}
.search-box svg{width:16px;height:16px; flex-shrink:0}
.search-box input{border:none; background:none; outline:none; color:var(--text); font-size:13.5px; width:100%}
.topbar-spacer{flex:1}
.chip-select{
  display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:var(--r-sm);
  background:var(--surface); border:1px solid var(--border); font-size:12.5px; font-weight:600; color:var(--text);
}
.chip-select select{border:none; background:none; outline:none; color:inherit; font-weight:600; font-size:12.5px}
.icon-btn{
  width:38px; height:38px; border-radius:var(--r-sm); background:var(--surface); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; color:var(--muted); position:relative;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s, color .18s, border-color .18s;
}
.icon-btn svg{width:17px;height:17px}
.icon-btn:hover{transform:translateY(-2px); box-shadow:var(--shadow-sm); color:var(--text)}
.icon-btn:active{transform:scale(.92)}
.icon-btn .dot-badge{
  position:absolute; top:6px; right:6px; width:7px; height:7px; border-radius:50%; background:var(--bad);
  box-shadow:0 0 0 2px var(--surface);
}
.profile-chip{
  display:flex; align-items:center; gap:9px; padding:5px 12px 5px 5px; border-radius:99px;
  background:var(--surface); border:1px solid var(--border); cursor:pointer;
}
.avatar{
  width:30px; height:30px; border-radius:50%; background:var(--grad); display:flex; align-items:center;
  justify-content:center; color:#fff; font-weight:800; font-size:12.5px; flex-shrink:0;
}
.profile-chip .pname{font-size:12.5px; font-weight:700; line-height:1.1}
.profile-chip .prole{font-size:10.5px; color:var(--muted); font-weight:500}

.view{padding:8px 28px 48px; max-width:1240px; width:100%; margin:0 auto}

.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin:18px 0 22px; flex-wrap:wrap}
.page-head h2{font-size:24px; font-weight:800; letter-spacing:-.02em}
.page-head p{margin:4px 0 0; color:var(--muted); font-size:13.5px}

/* ============================================================
   CARDS / PRIMITIVES
   ============================================================ */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
  padding:20px; box-shadow:var(--shadow-sm);
  animation:cardIn .5s cubic-bezier(.22,1,.36,1) backwards;
  transition:box-shadow .25s ease, border-color .25s ease;
}
.card:hover{box-shadow:var(--shadow-md)}
@keyframes cardIn{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)}}
.card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:10px}
.card-title{font-size:13px; font-weight:700; color:var(--muted)}
.card-title.strong{color:var(--text); font-size:15px}

.grid{display:grid; gap:16px}
.grid-stats{grid-template-columns:repeat(5,1fr)}
.grid-2{grid-template-columns:1.3fr 1fr}
.grid-3{grid-template-columns:2fr 1fr}
@media(max-width:1100px){.grid-stats{grid-template-columns:repeat(3,1fr)} .grid-2,.grid-3{grid-template-columns:1fr}}
@media(max-width:640px){.grid-stats{grid-template-columns:repeat(2,1fr)}}

.stat-card{display:flex; flex-direction:column; gap:10px; position:relative; overflow:hidden}
.stat-icon{
  width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  background:var(--surface-2); color:var(--accent);
}
.stat-icon svg{width:17px;height:17px}
.stat-val{font-family:var(--font-display); font-size:26px; font-weight:800; letter-spacing:-.02em}
.stat-lbl{font-size:12px; color:var(--muted); font-weight:600}
.stat-trend{font-size:11px; font-weight:700; display:flex; align-items:center; gap:3px}
.stat-trend.up{color:var(--good)} .stat-trend.down{color:var(--bad)}

.badge{font-size:11.5px; padding:4px 10px; border-radius:99px; font-weight:700; display:inline-flex; align-items:center; gap:5px}
.badge.good{background:var(--good-bg); color:var(--good)}
.badge.warn{background:var(--warn-bg); color:var(--warn)}
.badge.bad{background:var(--bad-bg); color:var(--bad)}
.badge.muted{background:var(--surface-2); color:var(--muted)}

.progress{height:8px; border-radius:99px; background:var(--ring-track); overflow:hidden; position:relative}
.progress > div{height:100%; border-radius:99px; transition:width .7s cubic-bezier(.22,1,.36,1)}

.btn{
  padding:11px 18px; border-radius:var(--r-sm); border:none; background:var(--grad); color:#fff;
  font-weight:700; font-size:13.5px; box-shadow:0 6px 16px -6px color-mix(in srgb, var(--accent) 60%, transparent);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s; display:inline-flex; align-items:center; gap:8px;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.97)}
.btn.secondary{background:var(--surface); color:var(--text); border:1px solid var(--border); box-shadow:none}
.btn.secondary:hover{border-color:var(--accent); color:var(--accent)}
.btn.ghost{background:none; box-shadow:none; color:var(--muted); padding:8px 10px}
.btn.ghost:hover{color:var(--text)}
.btn.sm{padding:8px 13px; font-size:12.5px}
.btn.block{width:100%; justify-content:center}
.btn.danger{background:var(--bad); box-shadow:0 6px 16px -6px rgba(224,71,90,.5)}

input[type=number],input[type=text],input[type=time],input[type=date],select.field{
  width:100%; padding:10px 13px; border-radius:var(--r-sm); border:1px solid var(--border);
  background:var(--bg); color:var(--text); font-size:13.5px; transition:border-color .2s, box-shadow .2s;
}
input:focus,select.field:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 14%, transparent)}
label.field-label{font-size:11.5px; color:var(--muted); font-weight:700; display:block; margin:0 0 6px; text-transform:uppercase; letter-spacing:.04em}

.empty{
  text-align:center; color:var(--muted); padding:44px 20px; font-size:13.5px; display:flex; flex-direction:column;
  align-items:center; gap:10px;
}
.empty svg{width:38px; height:38px; opacity:.4}

/* ---------- skeletons ---------- */
.skel{background:linear-gradient(90deg, var(--surface-2) 25%, var(--border-soft) 37%, var(--surface-2) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:10px}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}

/* ============================================================
   HOME VIEW
   ============================================================ */
.hero-ring-wrap{display:flex; align-items:center; gap:22px}
.ring-svg{flex-shrink:0}
.ring-meta .num{font-family:var(--font-display); font-size:38px; font-weight:800; letter-spacing:-.02em}
.ring-meta .lbl{color:var(--muted); font-size:13px; font-weight:600; margin-top:2px}
.ring-meta .sub{font-size:12px; color:var(--muted); margin-top:10px}

.class-row{
  display:flex; align-items:center; justify-content:space-between; gap:14px; padding:14px 6px;
  border-bottom:1px solid var(--border-soft); transition:background .18s ease, padding-left .18s ease;
  border-radius:12px;
}
.class-row:hover{background:var(--surface-2); padding-left:10px}
.class-row:last-child{border-bottom:none}
.class-info{display:flex; align-items:center; gap:13px; min-width:0}
.subj-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0; box-shadow:0 0 0 4px currentColor; opacity:.85}
.class-name{font-weight:700; font-size:14px; letter-spacing:-.005em}
.class-meta{font-size:12px; color:var(--muted); margin-top:3px}

.seg{display:flex; border:1px solid var(--border); border-radius:11px; overflow:hidden; flex-shrink:0}
.seg button{
  border:none; background:var(--bg); color:var(--muted); font-size:11.5px; font-weight:700; padding:8px 12px;
  transition:background .18s, color .18s; display:flex; align-items:center; gap:5px; border-right:1px solid var(--border);
}
.seg button:last-child{border-right:none}
.seg button svg{width:13px;height:13px}
.seg button:hover{color:var(--text)}
.seg button.p.on{background:var(--good); color:#fff}
.seg button.a.on{background:var(--bad); color:#fff}
.seg button.c.on{background:var(--muted); color:#fff}

.alert-row{display:flex; align-items:center; gap:12px; padding:11px 4px}
.alert-dot{width:8px; height:8px; border-radius:50%; background:var(--bad); flex-shrink:0}
.alert-row .t{font-size:13px; font-weight:600}
.alert-row .m{font-size:11.5px; color:var(--muted)}

/* ============================================================
   TIMETABLE
   ============================================================ */
.tt-grid{display:grid; grid-template-columns:64px repeat(6,1fr); gap:8px}
.tt-head{font-size:11.5px; font-weight:700; color:var(--muted); text-align:center; padding:6px 0 10px; text-transform:uppercase; letter-spacing:.04em}
.tt-time{font-size:10.5px; color:var(--muted); font-weight:600; padding-top:4px; text-align:right; padding-right:6px}
.tt-col{position:relative; min-height:640px; background:var(--surface-2); border-radius:14px; border:1px solid var(--border-soft)}
.tt-block{
  position:absolute; left:5px; right:5px; border-radius:10px; padding:7px 9px; overflow:hidden;
  color:#fff; font-size:11px; font-weight:700; box-shadow:var(--shadow-sm); cursor:default;
  transition:transform .15s ease, box-shadow .15s ease; line-height:1.3;
}
.tt-block:hover{transform:scale(1.02); box-shadow:var(--shadow-md); z-index:5}
.tt-block .tt-sub{font-size:10px; font-weight:600; opacity:.9; display:block; margin-top:1px}

/* ============================================================
   SUBJECTS
   ============================================================ */
.subject-card{display:flex; flex-direction:column; gap:12px}
.subject-card .sc-top{display:flex; align-items:center; justify-content:space-between; gap:10px}
.subject-card .sc-name-wrap{display:flex; align-items:center; gap:10px; min-width:0}
.subject-chip{width:34px; height:34px; border-radius:10px; flex-shrink:0}
.subject-card .sc-name{font-weight:700; font-size:14.5px; letter-spacing:-.01em}
.subject-card .sc-code{font-size:11.5px; color:var(--muted); font-weight:600}
.sc-foot{display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted); font-weight:600}

/* ============================================================
   CALENDAR (month)
   ============================================================ */
.month-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
.month-dow{font-size:10.5px; font-weight:700; color:var(--muted); text-align:center; padding:4px 0 8px; text-transform:uppercase}
.month-cell{
  aspect-ratio:1/0.85; border-radius:12px; border:1px solid var(--border-soft); background:var(--surface-2);
  display:flex; flex-direction:column; justify-content:space-between; padding:7px; cursor:pointer;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1), border-color .15s, background .15s;
}
.month-cell:hover{transform:translateY(-2px); border-color:var(--accent)}
.month-cell.out{opacity:.35}
.month-cell.today{border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent)}
.month-cell.sel{background:var(--grad); border-color:transparent}
.month-cell.sel .mc-num, .month-cell.sel .mc-dots span{color:#fff !important}
.month-cell .mc-num{font-size:12.5px; font-weight:700}
.month-cell .mc-dots{display:flex; gap:3px; flex-wrap:wrap}
.month-cell .mc-dots span{width:5px; height:5px; border-radius:50%; display:inline-block}

.week-strip{display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-bottom:16px}
.day-cell{
  text-align:center; padding:10px 2px; border-radius:12px; font-size:11.5px; background:var(--surface-2);
  border:1px solid var(--border-soft); font-weight:700; cursor:pointer;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1), border-color .18s, background .18s, color .18s;
}
.day-cell .dn{color:var(--muted); font-weight:600; font-size:10px; margin-bottom:3px}
.day-cell:hover{transform:translateY(-2px); border-color:var(--accent)}
.day-cell.sel{background:var(--grad); color:#fff; border-color:transparent}
.day-cell.sel .dn{color:rgba(255,255,255,.85)}

/* ============================================================
   ANALYTICS
   ============================================================ */
.trend-wrap{width:100%; overflow-x:auto}
.legend-row{display:flex; gap:16px; flex-wrap:wrap; margin-top:10px}
.legend-item{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted); font-weight:600}
.legend-item span{width:9px; height:9px; border-radius:50%}

/* ============================================================
   REMINDERS / SETTINGS
   ============================================================ */
.setting-row{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 2px; border-bottom:1px solid var(--border-soft)}
.setting-row:last-child{border-bottom:none}
.setting-row .st{font-weight:700; font-size:13.5px}
.setting-row .sd{font-size:12px; color:var(--muted); margin-top:2px; max-width:440px}
.switch{width:42px; height:24px; border-radius:99px; background:var(--border); position:relative; border:none; flex-shrink:0; transition:background .2s}
.switch::after{content:''; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .22s cubic-bezier(.34,1.56,.64,1); box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on{background:var(--good)}
.switch.on::after{transform:translateX(18px)}

.install-card{
  display:flex; align-items:center; gap:16px; padding:20px; border-radius:var(--r-lg);
  background:var(--grad); color:#fff; box-shadow:var(--shadow-md); position:relative; overflow:hidden;
}
.install-card::after{content:''; position:absolute; inset:0; background:radial-gradient(circle at 90% -20%, rgba(255,255,255,.25), transparent 60%)}
.install-card .ic-icon{width:52px; height:52px; border-radius:14px; background:rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; flex-shrink:0}
.install-card .ic-icon svg{width:26px;height:26px}
.install-card h3{font-size:16px; font-weight:800}
.install-card p{font-size:12.5px; opacity:.9; margin-top:3px}
.install-card .btn{background:#fff; color:var(--accent); box-shadow:none}

/* ============================================================
   TOAST / DIALOG
   ============================================================ */
.toast-stack{position:fixed; bottom:26px; left:50%; transform:translateX(-50%); z-index:100; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none}
.toast{
  background:var(--text); color:var(--bg); padding:12px 20px; border-radius:99px; font-size:13px; font-weight:600;
  box-shadow:var(--shadow-lg); opacity:0; transform:translateY(12px); transition:opacity .25s ease, transform .25s ease;
  display:flex; align-items:center; gap:8px; white-space:nowrap;
}
.toast.show{opacity:1; transform:translateY(0)}
.toast svg{width:15px;height:15px; flex-shrink:0}

.modal-backdrop{
  position:fixed; inset:0; background:rgba(5,8,16,.55); backdrop-filter:blur(3px); z-index:90;
  display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .2s ease; padding:20px;
}
.modal-backdrop.show{opacity:1; pointer-events:auto}
.modal{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:24px;
  width:420px; max-width:100%; box-shadow:var(--shadow-lg); transform:scale(.96) translateY(8px); transition:transform .22s cubic-bezier(.34,1.56,.64,1);
}
.modal-backdrop.show .modal{transform:scale(1) translateY(0)}
.modal h3{font-size:16px; font-weight:800; margin-bottom:16px}
.modal-foot{display:flex; justify-content:flex-end; gap:10px; margin-top:20px}

/* ============================================================
   MOBILE
   ============================================================ */
.mobile-more-sheet{
  position:fixed; inset:0; z-index:95; background:rgba(5,8,16,.5); opacity:0; pointer-events:none; transition:opacity .2s;
  display:flex; align-items:flex-end;
}
.mobile-more-sheet.show{opacity:1; pointer-events:auto}
.sheet-panel{
  background:var(--surface); width:100%; border-radius:22px 22px 0 0; padding:14px 10px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(100%); transition:transform .25s cubic-bezier(.22,1,.36,1); box-shadow:var(--shadow-lg);
}
.mobile-more-sheet.show .sheet-panel{transform:translateY(0)}
.sheet-handle{width:36px; height:4px; background:var(--border); border-radius:99px; margin:2px auto 14px}
.sheet-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
.sheet-item{display:flex; flex-direction:column; align-items:center; gap:8px; padding:14px 6px; border-radius:14px; background:none; border:none; color:var(--text); font-size:12px; font-weight:600}
.sheet-item svg{width:20px;height:20px; color:var(--accent)}
.sheet-item:active{background:var(--surface-2)}

.bottom-nav{
  display:none; position:fixed; bottom:0; left:0; right:0; z-index:50;
  background:color-mix(in srgb, var(--bg-elev) 92%, transparent); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--border); padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}
.bn-row{display:flex; justify-content:space-around}
.bn-item{background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--muted); font-size:10px; font-weight:700; padding:6px 10px; border-radius:12px; transition:color .2s, transform .18s cubic-bezier(.34,1.56,.64,1)}
.bn-item svg{width:19px;height:19px}
.bn-item.active{color:var(--accent)}
.bn-item:active{transform:scale(.9)}

/* ============================================================
   LOGIN SCREEN
   ============================================================ */
.login-screen{
  position:fixed; inset:0; z-index:200; background:var(--bg); display:flex; align-items:center; justify-content:center;
  padding:24px;
}
.login-card{
  width:380px; max-width:100%; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-xl);
  padding:36px 30px; box-shadow:var(--shadow-lg); text-align:center;
}
.login-card .brand-mark{width:56px; height:56px; border-radius:16px; background:var(--grad); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; box-shadow:var(--shadow-md)}
.login-card .brand-mark svg{width:28px;height:28px}
.login-card h2{font-size:20px; font-weight:800; letter-spacing:-.01em}
.login-card p{font-size:13px; color:var(--muted); margin-top:8px; line-height:1.5}
.google-btn{
  display:flex; align-items:center; justify-content:center; gap:10px; width:100%; margin-top:26px;
  padding:12px 16px; border-radius:var(--r-sm); background:var(--surface); border:1px solid var(--border);
  font-size:14px; font-weight:700; color:var(--text); transition:transform .15s cubic-bezier(.34,1.56,.64,1), box-shadow .18s, border-color .18s;
}
.google-btn:hover{transform:translateY(-2px); box-shadow:var(--shadow-md); border-color:var(--accent)}
.google-btn:active{transform:scale(.97)}
.google-btn svg{width:18px;height:18px; flex-shrink:0}
.login-foot{margin-top:18px; font-size:11.5px; color:var(--muted)}
.batch-pick{display:flex; gap:12px; margin-top:6px}
.batch-opt{
  flex:1; padding:18px 12px; border-radius:var(--r-md); border:1.5px solid var(--border); background:var(--surface-2);
  font-weight:700; font-size:14px; color:var(--text); transition:border-color .18s, transform .15s cubic-bezier(.34,1.56,.64,1), background .18s;
}
.batch-opt:hover{transform:translateY(-2px); border-color:var(--accent)}
.batch-opt .bo-sub{display:block; font-size:11px; font-weight:600; color:var(--muted); margin-top:4px}
.profile-chip.clickable{cursor:pointer}
.profile-chip .avatar img{width:100%; height:100%; border-radius:50%; object-fit:cover}

@media(max-width:900px){
  .sidebar{display:none}
  .bottom-nav{display:block}
  .view{padding:8px 16px 100px}
  .topbar{padding:14px 16px}
  .search-box{display:none}
  .grid-stats{grid-template-columns:repeat(2,1fr)}
  .hero-ring-wrap{flex-direction:column; align-items:flex-start}
  .tt-grid{grid-template-columns:44px repeat(6,minmax(90px,1fr)); overflow-x:auto}
}
</style>

/* ============================================================
   DATE HELPERS
   ============================================================ */
function fmtDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayStr(){ return fmtDate(new Date()); }
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function dayName(n){ return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][n]; }
function fullDayName(n){ return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][n]; }
function niceDate(s){ const d=parseDate(s); return d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'}); }
function monthLabel(d){ return d.toLocaleDateString('en-IN',{month:'long',year:'numeric'}); }

function classesForDate(dateStr){
  const d = parseDate(dateStr); const dow = d.getDay();
  if(state.holidays[dateStr]) return [];
  const scheduled = getTimetable().filter(c=>c.day===dow).map(c=>({...c, date:dateStr, key:dateStr+"|"+c.id}));
  const manual = state.manualClasses.filter(m=>m.date===dateStr).map(m=>({...m, key:dateStr+"|"+m.id}));
  return [...scheduled, ...manual].sort((a,b)=> a.start.localeCompare(b.start));
}

/* ============================================================
   ATTENDANCE ENGINE (unchanged math from original app)
   ============================================================ */
function getSemesterStart(){
  if(state.semesterStart) return parseDate(state.semesterStart);
  const keys = Object.keys(state.records);
  if(keys.length){ const dates = keys.map(k=>k.split('|')[0]).sort(); return parseDate(dates[0]); }
  return addDays(new Date(), -7*8);
}
function computeStats(){
  const start = getSemesterStart(); const end = new Date();
  const perSubject = {};
  Object.keys(SUBJECTS).forEach(c=> perSubject[c] = {attended:0,total:0,cancelled:0,marked:0});
  let cur = new Date(start);
  while(cur <= end){
    const ds = fmtDate(cur);
    classesForDate(ds).forEach(c=>{
      const status = state.records[c.key]; const s = perSubject[c.subject]; if(!s) return;
      if(status === 'cancelled'){ s.cancelled++; return; }
      if(status === 'present'){ s.attended++; s.total++; s.marked++; }
      else if(status === 'absent'){ s.total++; s.marked++; }
    });
    cur = addDays(cur,1);
  }
  return perSubject;
}
function pct(s){ return s.total===0 ? 100 : Math.round((s.attended/s.total)*1000)/10; }
function classesToReachThreshold(s, threshold){
  if(pct(s) >= threshold) return 0;
  let attended=s.attended, total=s.total, n=0;
  while(total===0 || (attended/total)*100 < threshold){ attended++; total++; n++; if(n>500) break; }
  return n;
}
function safeToMiss(s, threshold){
  if(pct(s) < threshold) return 0;
  let attended=s.attended, total=s.total, n=0;
  while(true){ const nt=total+1; if((attended/nt)*100 < threshold) break; total=nt; n++; if(n>500) break; }
  return n;
}
function overallStats(){
  const per = computeStats(); let attended=0, total=0;
  Object.values(per).forEach(s=>{ attended+=s.attended; total+=s.total; });
  return { attended, total, pct: total===0?100:Math.round((attended/total)*1000)/10, per };
}
function weeklyTrend(weeks=10){
  const end = new Date(); const out = [];
  for(let w=weeks-1; w>=0; w--){
    const wEnd = addDays(end, -7*w);
    const wStart = addDays(wEnd, -6);
    let attended=0, total=0;
    let cur = new Date(wStart);
    while(cur <= wEnd && cur <= end){
      const ds = fmtDate(cur);
      classesForDate(ds).forEach(c=>{
        const status = state.records[c.key];
        if(status==='present'){ attended++; total++; }
        else if(status==='absent'){ total++; }
      });
      cur = addDays(cur,1);
    }
    out.push({ label: wEnd.toLocaleDateString('en-IN',{day:'numeric',month:'short'}), pct: total===0?null:Math.round((attended/total)*1000)/10 });
  }
  return out;
}

/* ---------- radial ring ---------- */
function ringSVG(p, threshold, size=132){
  const stroke = 12; const r=(size-stroke)/2; const c=2*Math.PI*r;
  const clamped = Math.max(0, Math.min(100, p));
  const offset = c - (clamped/100)*c;
  const color = p>=threshold ? 'var(--good)' : p>=threshold-10 ? 'var(--warn)' : 'var(--bad)';
  return `<svg class="ring-svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--ring-track)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"
      transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset .8s cubic-bezier(.22,1,.36,1)"/>
  </svg>`;
}

function refreshReminderDot(){
  const ov = overallStats();
  const low = Object.entries(ov.per).filter(([c,s])=> s.total>0 && pct(s) < state.threshold);

}

/* ---------- TIMETABLE ---------- */
function renderTimetable(){
  const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat'];
  const dayStart = 9*60, dayEnd = 17*60; const totalMin = dayEnd-dayStart;
  let cols = '';
  for(let d=1; d<=6; d++){
    const items = getTimetable().filter(c=>c.day===d);
    let blocks = items.map(c=>{
      const sub = SUBJECTS[c.subject];
      const [sh,sm] = c.start.split(':').map(Number); const [eh,em] = c.end.split(':').map(Number);
      const top = ((sh*60+sm - dayStart)/totalMin)*100;
      const height = ((eh*60+em - (sh*60+sm))/totalMin)*100;
      return `<div class="tt-block" style="top:${top}%; height:${Math.max(height,6)}%; background:${sub.color}">
        ${sub.code}<span class="tt-sub">${c.start}–${c.end} · ${typeLabel(c)}</span>

        ${Object.values(SUBJECTS).map(s=>`<div class="legend-item"><span style="background:${s.color}"></span>${s.code} — ${s.name}</div>`).join('')}

/* ---------- ANALYTICS ---------- */
function trendChartSVG(data, w=760, h=220){
  const pad = 30;
  const vals = data.map(d=>d.pct).filter(v=>v!==null);
  const max = 100, min = 0;
  const xStep = (w - pad*2) / (data.length-1 || 1);
  let points = [];
  data.forEach((d,i)=>{
    if(d.pct===null) return;
    const x = pad + i*xStep;
    const y = h - pad - ((d.pct-min)/(max-min))*(h-pad*2);
    points.push([x,y]);
  });
  const line = points.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = points.length ? `M${points[0][0]},${h-pad} ` + points.map(p=>`L${p[0]},${p[1]}`).join(' ') + ` L${points[points.length-1][0]},${h-pad} Z` : '';
  const thresholdY = h - pad - ((state.threshold-min)/(max-min))*(h-pad*2);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="min-width:560px">
    <defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity=".28"/>
      <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient></defs>
    <line x1="${pad}" y1="${thresholdY}" x2="${w-pad}" y2="${thresholdY}" stroke="var(--bad)" stroke-dasharray="4 5" stroke-width="1.5"/>
    <text x="${w-pad}" y="${thresholdY-6}" text-anchor="end" font-size="10" fill="var(--muted)">${state.threshold}% threshold</text>
    ${area?`<path d="${area}" fill="url(#areaGrad)"/>`:''}
    ${line?`<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`:''}
    ${points.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>`).join('')}
    ${data.map((d,i)=>`<text x="${pad+i*xStep}" y="${h-8}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${d.label}</text>`).join('')}
  </svg>`;
}

/* ---------- CALENDAR (month view) ---------- */
function dayStatusDots(ds){
  const classes = classesForDate(ds);
  if(state.holidays[ds]) return [{c:'var(--muted)'}];
  if(!classes.length) return [];
  const statuses = classes.map(c=>state.records[c.key]);
  const out = [];
  if(statuses.some(s=>s==='present')) out.push({c:'var(--good)'});
  if(statuses.some(s=>s==='absent')) out.push({c:'var(--bad)'});
  if(statuses.some(s=>!s)) out.push({c:'var(--border)'});
  return out.slice(0,3);
}

    <input type="text" id="mcRoom" placeholder="e.g. TL-110" value="TL-110">
    <div class="modal-foot">
      <button class="btn secondary" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="submitManualClass('${ds}')">Add class</button>
    </div>`);
};
window.submitManualClass = function(ds){
  const subject = document.getElementById('mcSubject').value;
  const start = document.getElementById('mcStart').value;
  const end = document.getElementById('mcEnd').value;
  const room = document.getElementById('mcRoom').value || '—';
  if(!start || !end){ toast("Enter start and end time","bad"); return; }
  const id = 'manual-'+Date.now();
  state.manualClasses.push({id, date:ds, subject, type:'lecture', start, end, room});
  saveState(); closeModal(); render(); toast("Class added");
};

/* ============================================================
   NOTIFICATIONS
   ============================================================ */
function scheduleReminders(){
  setInterval(()=>{
    const now = new Date(); const ds = todayStr();
    classesForDate(ds).forEach(c=>{
      const [eh,em] = c.end.split(':').map(Number);
      const endTime = new Date(); endTime.setHours(eh,em+10,0,0);
      const diff = now - endTime;
      if(diff>=0 && diff < 5*60*1000 && !state.records[c.key]){
        new Notification("Mark attendance", {body:`${SUBJECTS[c.subject].name} just ended — tap to mark it.`});
      }
    });
  }, 5*60*1000);
}
if('Notification' in window && Notification.permission==='granted') scheduleReminders();

/* ============================================================
   PWA — service worker + install prompt
   ============================================================ */
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  updateInstallCardVisibility();
});
window.addEventListener('appinstalled', ()=>{ deferredInstallPrompt = null; toast("App installed"); updateInstallCardVisibility(); });
function updateInstallCardVisibility(){
  const card = document.getElementById('installCard');
  if(!card) return;
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  card.style.display = isStandalone ? 'none' : 'flex';
}
window.triggerInstall = async function(){
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    const choice = await deferredInstallPrompt.userChoice;
    if(choice.outcome === 'accepted') toast("Installing…");
    deferredInstallPrompt = null;
  } else {
    toast("Use your browser's 'Add to Home Screen' option", null);
  }
};
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{ /* fine on file:// or unsupported hosts */ });
  });
}

/* ============================================================
   NAV WIRING
   ============================================================ */
function goto(view){ currentView = view; render(); }
document.querySelectorAll('.nav-item, .bn-item[data-view], .sheet-item').forEach(el=>{
  el.addEventListener('click', ()=>{ goto(el.dataset.view); document.getElementById('moreSheet').classList.remove('show'); });
});
window.addEventListener('nav', (e)=> goto(e.detail));
document.getElementById('moreBtn').addEventListener('click', ()=> document.getElementById('moreSheet').classList.add('show'));
document.getElementById('moreSheet').addEventListener('click', (e)=>{ if(e.target.id==='moreSheet') e.currentTarget.classList.remove('show'); });
document.getElementById('notifBtn').addEventListener('click', ()=> goto('reminders'));

setSyncDot('offline');
render();
</script>
